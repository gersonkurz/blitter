name: Blitter

options:
  bundleIdPrefix: com.p-nand-q
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 9T5S26964D
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    # Debug builds are signed ad hoc so local builds and tests never touch the keychain.
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES

packages:
  # The settings file is TOML (#11); TOMLKit wraps the toml++ parser. Pinned.
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    exactVersion: 0.6.0

targets:
  BlitterCore:
    type: framework.static
    platform: macOS
    sources: [Sources/BlitterCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  BlitterModel:
    type: framework.static
    platform: macOS
    sources: [Sources/BlitterModel]
    dependencies:
      - target: BlitterCore
      - package: TOMLKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Git's dialogs (#23): their models and the git commands behind them. No AppKit; the windows
  # are the app's.
  BlitterGit:
    type: framework.static
    platform: macOS
    sources: [Sources/BlitterGit]
    dependencies:
      - target: BlitterModel
      - target: BlitterCore
      # BlitterModel's interface refers to TOMLKit.
      - package: TOMLKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # The command-line tool on the automation socket (#59), inside the app at Contents/Helpers
  # (not next to the app's executable: "blitter" and "Blitter" are one name on most volumes).
  # The target and module are BlitterCLI (a module "blitter" would be found for "Blitter"); the
  # executable is blitter.
  BlitterCLI:
    type: tool
    platform: macOS
    sources: [Sources/BlitterCLI]
    dependencies:
      - target: BlitterCore
    settings:
      base:
        PRODUCT_NAME: blitter
        PRODUCT_MODULE_NAME: BlitterCLI

  Blitter:
    type: application
    platform: macOS
    sources: [Sources/BlitterApp]
    dependencies:
      - target: BlitterCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # Static frameworks are linked into the executable, so there is nothing to embed.
      - target: BlitterGit
        embed: false
      - target: BlitterModel
        embed: false
      - target: BlitterCore
        embed: false
    info:
      path: Sources/BlitterApp/Info.plist
      properties:
        CFBundleDisplayName: Blitter
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Gerson Kurz. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p-nand-q.blitter

  BlitterCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BlitterCoreTests]
    dependencies:
      - target: BlitterCore
      # The tool's tests run the built tool (#59).
      - target: BlitterCLI
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  BlitterModelTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BlitterModelTests]
    dependencies:
      - target: BlitterModel
      - target: BlitterCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  BlitterGitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BlitterGitTests]
    dependencies:
      - target: BlitterGit
      - target: BlitterModel
      - target: BlitterCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Hosted in the app, so view controllers run in a real window with the real main menu.
  BlitterAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BlitterAppTests]
    dependencies:
      - target: Blitter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Blitter.app/Contents/MacOS/Blitter
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Blitter:
    build:
      targets:
        Blitter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlitterCoreTests
        - BlitterModelTests
        - BlitterGitTests
        - BlitterAppTests
    archive:
      config: Release
