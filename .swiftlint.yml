included:
  - Sources
  - Tests

excluded:
  - build
  - releases
  - Blitter.xcodeproj

# Formatting is swiftformat's job; these rules would fight it.
disabled_rules:
  - trailing_comma
  - opening_brace

line_length:
  warning: 120
  ignores_comments: true

# The command dispatch switch grows with every command; its cases are one line each.
cyclomatic_complexity:
  ignores_case_statements: true
