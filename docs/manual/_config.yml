# GitHub Pages (Jekyll) settings for the manual: only docs/manual is published (see
# .github/workflows/manual.yml). Links between pages are written as relative .md links; the
# relative-links plugin turns them into page links, and they work on github.com as well.
title: Blitter Manual
description: A fast two-pane file manager for macOS, in the spirit of Directory Opus.
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
